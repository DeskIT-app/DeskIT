# The product suite on a hosted Windows runner — DISTRIBUTION_PLAN.md
# chapter 15, "CI shape", PR 8. Only tests.py runs here; dev/tests_ops.py
# (the nightly run, the git card, the routine's docs) is the owner's and
# runs on his checkout alone.
#
# The runner has an interactive session, but nobody is looking at it, so
# the sixteen tests that grab the display or move the real mouse
# (tests.NEEDS_SCREEN) are skipped exactly as they are while the owner is
# at his desk: `tests.py --no-screen`. The nightly run on his machine is
# where they run.
#
# DESKIT_PORTABLE=1 and no DESKIT_HOME: paths.py sees .git beside main.py
# and treats the checkout as the data folder, the same layout the suite
# is written for on the owner's machine (test_paths_checkout_is_portable_
# and_nothing_moved holds it). There is no profile on a runner to protect;
# the checkout is thrown away with the job.
name: tests

on:
  push:
    branches: ["**"]      # not tags: a v* tag is a commit main already tested
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    runs-on: windows-latest
    timeout-minutes: 45
    # The same commit arrives twice: once on the lane's branch and, a
    # minute later, as main (12 of 37 commits on 2026-09-18). The group
    # above is per ref, so both ran and a red one wrote two e-mails. This
    # group is per commit: the second start cancels the first, a
    # cancelled run sends nothing, and the result is the same either way.
    concurrency:
      group: tests-sha-${{ github.sha }}
      cancel-in-progress: true
    env:
      DESKIT_PORTABLE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            packs.lock

      # The base set exactly as the installer lays it down (10.3 steps 1
      # and 5, packaging/build_local.ps1): requirements.lock, every wheel
      # hashed, no dependency resolution, wheels only. A lock that drifts
      # from requirements.txt, or a module that imports something the
      # lock never carried, fails here before it fails on a stranger's
      # machine. The lock pins pip itself (10.2), so the runner's pip is
      # replaced by the product's.
      #
      # Then the Recording pack the way packs.py fetches it — av pinned
      # and hashed from packs.lock (13.4, D24; faster-whisper imports it,
      # and the suite records) — and requests, the suite's own HTTP
      # client for the phone routes: a test dependency, not a product one.
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements.lock
          python -c "import packs, sys; sys.stdout.write(packs.requirements_text(packs.pack('recording')))" | Set-Content -Path (Join-Path $env:RUNNER_TEMP recording.txt) -Encoding utf8
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r (Join-Path $env:RUNNER_TEMP recording.txt)
          python -m pip install requests
          python -m pip check

      - name: Product suite
        shell: pwsh
        run: python tests.py --no-screen

      # The guide (chapter 14): the generated pages are fresh for this
      # defaults.toml, the trees are complete, every picture exists, the
      # privacy chapter is the plan's 5.10 word for word. File checks only.
      - name: The guide
        shell: pwsh
        run: python dev/test_docs.py
