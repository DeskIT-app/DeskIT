# The site — DISTRIBUTION_PLAN.md 14.1 (D26): docs/ on GitHub Pages at
# https://massifapp.github.io/DeskIT/, built by Pages' own Jekyll from
# main. Nothing here is the product: docs/ is export-ignored and never
# reaches an installed copy. The repository has to be public (or the
# account on a plan that serves Pages from a private one) and Pages set
# to "GitHub Actions" under Settings > Pages — the owner's hand-work.
name: pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
