# The build — DISTRIBUTION_PLAN.md 10.3, steps 0 to 7 (PR 10), 9 to 12
# (PR 11), 6b (PR 18) and 8, 13, 14 (PR 19): the channel word, the Inno
# installer, its SHA-256 and latest.json, a silent install + verify +
# uninstall on the runner, the build attestation, the VirusTotal scan
# with its threshold, and the DRAFT release with the notes — the owner
# publishes it after reading the scan (11.11). Step 15, winget, is
# winget.yml, on the release being published. Nothing here runs on the owner's PC:
# every byte of the staged tree traces to the tag, a hashed wheel or a
# SHA-verified python.org zip (D12 lock 5, D19).
#
# Inputs from the repo: VERSION, requirements.lock (pip-compile
# --generate-hashes over requirements.txt), packaging/python311._pth,
# packaging/python-embed.sha256. The runner's own Python is pinned to the
# same patch version as the embeddable zip because step 3 copies its
# Tcl/Tk tree and _tkinter.pyd, which are built against one python311.dll.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "build and keep the stage as an artifact; publish nothing"
        type: boolean
        default: true

env:
  PYTHON_VERSION: "3.11.9"
  EMBED_URL: "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip"

permissions:
  contents: write        # the draft release and its assets (step 14)
  id-token: write        # the build attestation (step 8)
  attestations: write

jobs:
  stage:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      # 0. checkout — the tag and VERSION must agree
      - uses: actions/checkout@v4

      - name: VERSION matches the tag
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            if ($tag -ne "v$version") { throw "tag $tag but VERSION says $version" }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "building DeskIT $version"
        id: version

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 0b. the guide's generated pages (chapter 14.6): a release whose
      # docs/en/settings.md is not what defaults.toml says does not ship.
      - name: The guide is fresh
        run: python dev/gen_settings_doc.py --check

      - name: The runner's Python is the embeddable's patch version
        run: |
          $got = (python -c "import platform; print(platform.python_version())").Trim()
          if ($got -ne "${{ env.PYTHON_VERSION }}") { throw "runner Python $got, embeddable ${{ env.PYTHON_VERSION }}" }

      # 1. wheelhouse — every wheel by hash, binary only, nothing compiled
      - name: Wheelhouse
        run: |
          python -m pip install --upgrade pip
          python -m pip download -r requirements.lock --require-hashes --no-deps --only-binary=:all: `
            --platform win_amd64 --python-version 3.11 --implementation cp --abi cp311 `
            --dest wheels
          Get-ChildItem wheels | Measure-Object -Property Length -Sum | ForEach-Object { "wheels: $($_.Count) files, $([math]::Round($_.Sum / 1MB)) MB" }

      # 2. embed — the python.org zip, checked against the committed SHA-256
      - name: Embeddable Python
        run: |
          Invoke-WebRequest -Uri "${{ env.EMBED_URL }}" -OutFile python-embed.zip
          $want = ((Get-Content packaging/python-embed.sha256 -Raw).Trim() -split "\s+")[0].ToLower()
          $got = (Get-FileHash python-embed.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "python-embed.zip SHA-256 $got, expected $want" }
          New-Item -ItemType Directory -Force stage/python | Out-Null
          Expand-Archive python-embed.zip -DestinationPath stage/python

      # 3. tk — the tree the embeddable zip lacks, from the runner's full install
      - name: Tcl/Tk
        run: |
          $py = $env:pythonLocation
          Copy-Item -Recurse "$py/tcl" stage/python/tcl
          New-Item -ItemType Directory -Force stage/python/Lib | Out-Null
          Copy-Item -Recurse "$py/Lib/tkinter" stage/python/Lib/tkinter
          foreach ($f in "_tkinter.pyd", "tcl86t.dll", "tk86t.dll", "zlib1.dll") {
            Copy-Item "$py/DLLs/$f" stage/python/$f
          }
          Get-ChildItem -Recurse stage/python -Include __pycache__ -Directory | Remove-Item -Recurse -Force

      # 4. pth — the committed one, so the interpreter sees Lib\ and site-packages
      - name: python311._pth
        run: Copy-Item packaging/python311._pth stage/python/python311._pth -Force

      # 5. install — from the wheelhouse only; the network is an error here
      - name: Install the wheelhouse
        run: |
          python -m pip install --no-index --find-links wheels --require-hashes --no-deps `
            -r requirements.lock --target stage/python/Lib/site-packages
          Get-ChildItem -Recurse stage/python/Lib/site-packages -Include __pycache__ -Directory | Remove-Item -Recurse -Force

      # 6. archive — the product tree, as .gitattributes' export-ignore leaves it
      - name: git archive
        run: |
          git archive --format=zip --output app.zip HEAD
          New-Item -ItemType Directory -Force stage/app | Out-Null
          Expand-Archive app.zip -DestinationPath stage/app
          foreach ($f in "LICENSE", "NOTICE", "OFL.txt", "NETWORK.md", "SECURITY.md") {
            if (Test-Path "stage/app/$f") { Copy-Item "stage/app/$f" "stage/$f" }
          }
          $forbidden = @("tests.py", "tests_quiet.py", "nightly.py", "questions.py", "AGENTS.md", "dev", "docs", "packaging", "android", ".github", ".gitattributes", ".gitignore")
          foreach ($f in $forbidden) { if (Test-Path "stage/app/$f") { throw "$f is in the archive" } }

      # 6b. notices — the generated half (pip-licenses over the staged
      #     site-packages) + the hand-written half (dev/notices-extra.txt,
      #     from the checkout, never the archive) + Python's own
      #     LICENSE.txt and Tcl's license.terms (13.3, D24)
      - name: THIRD-PARTY-NOTICES.txt
        run: |
          python -m pip install pip-licenses
          pip-licenses --python stage/python/python.exe --with-license-file --with-urls `
            --with-authors --format=plain-vertical --output-file generated-notices.txt
          $header = "THIRD-PARTY NOTICES for DeskIT $env:DESKIT_VERSION, built $(Get-Date -Format yyyy-MM-dd)`n" +
                    "Generated half: every wheel in the base wheelhouse (pip-licenses). Hand-written half: dev/notices-extra.txt.`n`n"
          $parts = @($header, (Get-Content generated-notices.txt -Raw -Encoding utf8), (Get-Content dev/notices-extra.txt -Raw -Encoding utf8))
          if (Test-Path stage/python/LICENSE.txt) {
            $parts += "`n`n================ python/LICENSE.txt ================`n" + (Get-Content stage/python/LICENSE.txt -Raw -Encoding utf8)
          }
          $tcl = Get-ChildItem -Recurse stage/python/tcl -Filter license.terms -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($tcl) {
            $parts += "`n`n================ tcl/license.terms ================`n" + (Get-Content $tcl.FullName -Raw -Encoding utf8)
          }
          [IO.File]::WriteAllText("stage/app/THIRD-PARTY-NOTICES.txt", ($parts -join ""), (New-Object Text.UTF8Encoding $false))
          Copy-Item stage/app/THIRD-PARTY-NOTICES.txt stage/THIRD-PARTY-NOTICES.txt
          "notices: $((Get-Item stage/app/THIRD-PARTY-NOTICES.txt).Length) bytes"
        env:
          DESKIT_VERSION: ${{ steps.version.outputs.version }}

      # 7. manifest — one line per file under python\ and app\
      - name: MANIFEST.sha256
        run: |
          python stage/app/manifest.py write stage
          python stage/app/manifest.py verify stage

      # 8a. attest — the manifest's provenance, what the FAQ's "read the
      #     build attestation" line points to (D12 lock 5). GitHub signs
      #     attestations for public repositories; a private one skips.
      - name: Attest MANIFEST.sha256
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: stage/MANIFEST.sha256

      - name: The staged tree starts
        run: |
          $out = & stage/python/python.exe -c "import sys, tkinter, numpy, PIL, sounddevice; print(sys.version.split()[0], tkinter.TkVersion, numpy.__version__)"
          Write-Host $out
          Get-ChildItem -Recurse stage -File | Measure-Object -Property Length -Sum | ForEach-Object { "stage: $($_.Count) files, $([math]::Round($_.Sum / 1MB)) MB" }

      # 9. channel — github here; the winget manifest passes /CHANNEL=winget
      #    to the same installer, the Store build writes store (10.4)
      - name: CHANNEL
        run: Set-Content -Path stage/CHANNEL -Value github -NoNewline -Encoding ascii

      # 10. inno — the runner image ships Inno Setup 6; the script takes the
      #     version, its four-part Windows form, the stage and the output dir
      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          $version = "${{ steps.version.outputs.version }}"
          $core = ($version -split '-')[0]
          $beta = if ($version -match '-beta\.(\d+)$') { $Matches[1] } else { '0' }
          $info = "$core.$beta"
          & $iscc packaging/DeskIT.iss /DVersion=$version /DVersionInfo=$info /DStage=stage /DOutDir=dist
          if ($LASTEXITCODE) { throw "ISCC failed" }
          Get-ChildItem dist

      # 11. sha + latest.json — the forms the guide and the Update card read
      - name: SHA-256 and latest.json
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $exe = "dist/DeskIT-Setup-$version.exe"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$exe.sha256" -Value "$sha  DeskIT-Setup-$version.exe" -Encoding ascii
          $latest = [ordered]@{
            version = $version
            url = "https://github.com/${{ github.repository }}/releases/download/v$version/DeskIT-Setup-$version.exe"
            sha256 = $sha
            size = (Get-Item $exe).Length
            min_config_version = [int](python -c "import version; print(version.MIN_CONFIG_VERSION)")
            notes_url = "https://github.com/${{ github.repository }}/releases/tag/v$version"
          }
          $latest | ConvertTo-Json | Set-Content -Path dist/latest.json -Encoding utf8
          Copy-Item stage/MANIFEST.sha256 dist/MANIFEST.sha256
          Get-Content "$exe.sha256", dist/latest.json

      # 12. smoke — the installer, silent, on the runner itself; the tree
      #     verifies against its manifest; the uninstaller leaves nothing
      - name: Silent install, verify, uninstall
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $log = "$env:RUNNER_TEMP\deskit-setup.log"
          $p = Start-Process -FilePath "dist/DeskIT-Setup-$version.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOLAUNCH", "/LOG=$log" -Wait -PassThru
          if ($p.ExitCode) { Get-Content $log; throw "the installer exited $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\DeskIT"
          if ((Get-Content "$app\CHANNEL" -Raw) -ne 'github') { throw "CHANNEL is not github" }
          & "$app\python\python.exe" "$app\app\manifest.py" verify $app
          if ($LASTEXITCODE) { throw "the installed tree does not verify" }
          & "$app\python\python.exe" -c "import sys; sys.path.insert(0, r'$app\app'); import paths, version; print('installed', version.VERSION, 'channel', paths.CHANNEL, 'data', paths.DATA_DIR)"
          if ($LASTEXITCODE) { throw "the installed app does not import" }
          $u = Start-Process -FilePath "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($u.ExitCode) { throw "the uninstaller exited $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $app) { Get-ChildItem -Recurse $app | Select-Object -First 20; throw "APP_DIR survived the uninstall" }

      # 8b. attest — the installer itself, after the smoke test passed
      - name: Attest the installer
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/DeskIT-Setup-${{ steps.version.outputs.version }}.exe

      # 13. virustotal — the installer to VirusTotal's free API; more than
      #     VT_MAX_DETECTIONS engines (a repository variable, default 2)
      #     fail the run so a bad build never reaches users (D19). Without
      #     the key the step says so and the release goes on unscanned.
      - name: VirusTotal
        id: virustotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          VT_MAX_DETECTIONS: ${{ vars.VT_MAX_DETECTIONS || '2' }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $exe = "dist/DeskIT-Setup-$version.exe"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $permalink = "https://www.virustotal.com/gui/file/$sha"
          if (-not $env:VT_API_KEY) {
            Write-Warning "VT_API_KEY is not set: the installer was NOT scanned. Add the secret before publishing."
            Set-Content dist/virustotal.txt "not scanned (no VT_API_KEY)"
            "permalink=" >> $env:GITHUB_OUTPUT
            "verdict=not scanned" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $headers = @{ "x-apikey" = $env:VT_API_KEY }
          # files over 32 MB go through a one-time upload URL
          $upload = (Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Headers $headers).data
          $form = @{ file = Get-Item $exe }
          $posted = Invoke-RestMethod -Uri $upload -Method Post -Headers $headers -Form $form
          $analysis = $posted.data.id
          $status = ""
          for ($i = 0; $i -lt 60 -and $status -ne "completed"; $i++) {
            Start-Sleep -Seconds 30
            $result = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/analyses/$analysis" -Headers $headers
            $status = $result.data.attributes.status
          }
          if ($status -ne "completed") { throw "VirusTotal did not finish in 30 minutes: $permalink" }
          $stats = $result.data.attributes.stats
          $hits = [int]$stats.malicious + [int]$stats.suspicious
          $verdict = "$hits engine(s) flagged it (malicious $($stats.malicious), suspicious $($stats.suspicious)) of $([int]$stats.harmless + [int]$stats.undetected + $hits)"
          "$verdict — $permalink" | Set-Content dist/virustotal.txt
          "permalink=$permalink" >> $env:GITHUB_OUTPUT
          "verdict=$verdict" >> $env:GITHUB_OUTPUT
          Write-Host $verdict
          if ($hits -gt [int]$env:VT_MAX_DETECTIONS) { throw "VirusTotal: $hits detections, more than VT_MAX_DETECTIONS=$env:VT_MAX_DETECTIONS — not released. $permalink" }

      - uses: actions/upload-artifact@v4
        with:
          name: DeskIT-${{ steps.version.outputs.version }}
          path: |
            dist/DeskIT-Setup-*.exe
            dist/DeskIT-Setup-*.exe.sha256
            dist/latest.json
            dist/MANIFEST.sha256
            dist/virustotal.txt

      # 14. release — a DRAFT with the notes from CHANGELOG.md under the
      #     version's heading, then the fixed block: SHA-256, VirusTotal,
      #     the attestation, the previous installer for rollback (11.7).
      #     The owner reads the scan and publishes (11.11 steps 5-7); a
      #     -beta tag publishes as a pre-release. Only for a real tag.
      - name: Release notes
        if: ${{ github.ref_type == 'tag' }}
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $repo = "${{ github.repository }}"
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $section = ""
          if ($log -match "(?ms)^## $([regex]::Escape($version))\b[^\n]*\n(.*?)(?=^## |\z)") { $section = $Matches[1].Trim() }
          if (-not $section) { throw "CHANGELOG.md has no '## $version' section (11.11 step 2)" }
          $previous = ""
          try { $previous = (gh api "repos/$repo/releases/latest" --jq .tag_name 2>$null) } catch {}
          $sha = (Get-Content "dist/DeskIT-Setup-$version.exe.sha256" -Raw).Split(" ")[0]
          $vt = "${{ steps.virustotal.outputs.permalink }}"
          $vtLine = if ($vt) { "VirusTotal: $vt (${{ steps.virustotal.outputs.verdict }})" } else { "VirusTotal: not scanned" }
          $prevLine = if ($previous) { "Previous version, for rollback: https://github.com/$repo/releases/tag/$previous" } else { "Previous version: none — this is the first release" }
          $body = @(
            $section, "",
            "---", "",
            "``DeskIT-Setup-$version.exe`` SHA-256: ``$sha``",
            $vtLine,
            "Build attestation: https://github.com/$repo/attestations",
            $prevLine,
            "Install: download the installer, or ``winget install YoavShimron.DeskIT`` once the manifest is merged."
          ) -join "`n"
          [IO.File]::WriteAllText("dist/notes.md", $body, (New-Object Text.UTF8Encoding $false))
          Get-Content dist/notes.md

      - name: Draft release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(steps.version.outputs.version, '-beta') }}
          name: DeskIT ${{ steps.version.outputs.version }}
          body_path: dist/notes.md
          files: |
            dist/DeskIT-Setup-${{ steps.version.outputs.version }}.exe
            dist/DeskIT-Setup-${{ steps.version.outputs.version }}.exe.sha256
            dist/latest.json
            dist/MANIFEST.sha256
            stage/THIRD-PARTY-NOTICES.txt
            dist/latest.json
            dist/MANIFEST.sha256
          retention-days: 14
