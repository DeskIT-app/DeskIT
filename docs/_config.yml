# The GitHub Pages site (DISTRIBUTION_PLAN.md 14.1, D26): Jekyll as Pages
# runs it, nothing else to build. The guide is Hebrew first (docs/he) with
# an English mirror (docs/en); the privacy policy and the terms are the two
# pages beside them; docs/strings and docs/distplan are not part of the site.
title: DeskIT
description: Hebrew dictation for Windows that stays on your PC — the Win+H that Hebrew never got.
baseurl: "/DeskIT"
url: "https://deskit-app.github.io"
lang: he
# No theme: docs/_layouts/default.html and docs/assets/site.css are the whole look.
markdown: kramdown
kramdown:
  input: GFM
permalink: pretty
exclude:
  - distplan
  - strings
  - README.md
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "he"
    values:
      lang: he
  - scope:
      path: "en"
    values:
      lang: en
