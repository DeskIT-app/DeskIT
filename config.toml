# Hebrew push-to-talk dictation — settings.
# Hotkey names come from the table in hotkey.py ("right ctrl", "f9", "scroll lock", "a".."z"...).
hotkey = "right ctrl"         # hold = dictate Hebrew
# Hold = dictate English (no guessing involved). "" turns it off.
# Deliberately NOT "right alt" (releasing Alt alone pops the menu bar in many
# apps, stealing focus right before we paste) and NOT "right shift" (holding
# it 8 s triggers Windows FilterKeys). f9 is inert almost everywhere.
english_hotkey = "f9"
# local = unlimited, offline, ~0.3 s. Measured 2026-08-12 on 8 real Hebrew
# clips: local 10.8% WER / 0.38 s vs gemini 15.9% WER / 2.71 s. Switch to
# "gemini" if you ever want its stronger cleanup instead.
backend = "local"             # gemini | local | fake
paste_chord = "ctrl+v"        # try "shift+insert" for terminals that reject ctrl+v
restore_delay_ms = 300        # wait after pasting before restoring the old clipboard
min_seconds = 0.3             # shorter holds are treated as accidental taps and discarded
max_seconds = 400             # runaway-recording cap: stop, discard, error beep
fallback_to_local = true      # when every cloud model is out of quota, use local whisper

[audio]
sample_rate = 16000
device = "1"                  # Arctis 7 headset mic (from --list-devices; "" = system default)

[feedback]
enabled = true                # paste a marker at the cursor while transcribing
placeholder = "..."           # replaced by your text when it arrives
retry_seconds = 45            # keep retrying this long before spooling to pending\

[gemini]
# Free-tier quota is PER MODEL (gemini-2.5-flash = 20 requests/day), so this
# list is a longer runway: each is tried in order and rested when it reports
# its cap. Verified as supporting audio input on 2026-08-12.
models = [
  "gemini-2.5-flash",
  "gemini-flash-latest",
  "gemini-2.5-flash-lite",
  "gemini-flash-lite-latest",
]
timeout_s = 30

[local]
model = "ivrit-ai/whisper-large-v3-turbo-ct2"
language = "he"               # MUST stay pinned — the fine-tune broke language autodetect
device = "auto"               # auto | cuda | cpu — auto tries the GPU, falls back to CPU
cleanup = true                # strip "אה"/"אמ" and collapse restarted phrases
                              # (Whisper only transcribes; Gemini also cleans)
extra_fillers = []            # add your own, e.g. ["כאילו"] — only add words you
                              # never mean literally; "כאילו" is a real word too

# The Hebrew fine-tune transliterates SHORT pure-English utterances
# ("Should it work?" -> "שיידי וורק"). Confident English is routed to a
# general model instead. Set english_model = "" to disable.
english_model = "deepdml/faster-whisper-large-v3-turbo-ct2"
english_threshold = 0.8       # high on purpose: mis-detected Hebrew is far worse
                              # than a transliterated English word
