# Hebrew push-to-talk dictation — settings.
# Hotkey names come from the table in hotkey.py ("right ctrl", "f8",
# "scroll lock", "a".."z", "f1".."f24"...).
#
# WHY THESE KEYS AND NOT THE OBVIOUS ONES
# The hook takes keys GLOBALLY and it does not swallow the four TAP keys:
# each one fires its action AND still reaches whatever has focus. So a tap
# key is only as good as the app it is pressed in — and on this machine
# that is one app, Chrome, holding Google Docs/Sheets/Drive/Gmail/Calendar,
# Microsoft 365 on the web, WhatsApp Web and Spotify. Between them they
# have taken nearly the whole keyboard. Checked 2026-08 against Chrome 151
# and Edge 151 (driven by SendInput against a page that logged what
# arrived) and against each vendor's published shortcut list:
#
#   MEASURED free   : f2, f13-f24, pause, scroll lock, and every ctrl+F
#                     tried (f1, f2, f3, f5, f6, f10-f16) — each reached
#                     the page and neither browser did anything with it
#   MEASURED taken  : f1, f3, f4, f5, f6, f10, f11, f12 — reload, full
#                     screen, or the caret leaving the page
#   NOT measured    : f7, f8, f9 and every chord on them. The probe never
#                     pressed them, so `f8`, `ctrl+f8` and `ctrl+f9` — the
#                     three keys shipped below — rest on their neighbours
#                     being clear and on published shortcut lists, not on
#                     a measurement. README says so at more length.
#
# Everything else bare is spoken for, and this is the list the defaults
# below were chosen out of: f1 help, f3 find, f4 the address bar and
# Excel's $A$1 toggle, f5 reload, f6 the address bar (Excel calls the same
# key the ribbon), f7 Chrome's caret-browsing PROMPT and Docs' spelling
# check, f10 the menu, f11 full screen, f12 DevTools and Steam's
# screenshot, insert Outlook's flag and overtype everywhere else, and
# every bare letter and digit — Gmail binds most of the alphabet, and
# Calendar binds j and k. Everything in this paragraph except f4 and the
# f1-f12 browser behaviour comes from vendor documentation, not from the
# probe: it is a page in a browser and cannot see inside Docs or Spotify.
#
# CHORDS
# The four tap keys accept "modifier+key": ctrl, shift or alt, either side
# ("ctrl+f8") or one named side ("left ctrl+f8"), with the key LAST.
# "f8+ctrl", "ctrl+shift" and "win+f8" are all refused with a sentence. A
# bare key still means exactly what it always meant, and "f8" and
# "ctrl+f8" are two different bindings that may both be bound: the chord
# wins when its modifiers match exactly, the bare key catches everything
# else, and only ever one of them fires. `hotkey`, `english_hotkey`,
# `latch_hotkey` and `pause_hotkey` REFUSE a modifier — they are held,
# latched and toggled rather than tapped, and a chord would mean something
# different for each of them.
#
# USE CTRL. NOT SHIFT, NOT ALT — and that is a rule about this app, not
# about Windows. A tap key injects ctrl+a / ctrl+c / ctrl+v within about
# 50 ms of firing (injector.SETTLE_SECONDS) and hotkey.send_chord does not
# release the modifier your hand is still holding. Ctrl is free of that
# because every chord this app sends already begins with ctrl, so ctrl
# held over ctrl+c is still ctrl+c. Shift is not: it turns that copy into
# ctrl+shift+c, which is Inspect Element in Chrome, and the select-all
# into ctrl+shift+a, which is Search Tabs and takes the focus the paste
# was about to land in. Alt is worse again — the NVIDIA overlay owns
# alt+f1/f2/f3/f9/f10 on this machine, alt+f4 sits one key from alt+f5,
# and left alt+shift switches keyboard layout. ctrl+alt is AltGr, which on
# the Hebrew layout is the niqqud level, and WhatsApp Web's entire
# shortcut scheme lives in ctrl+alt besides.
# Press a ctrl chord with the LEFT ctrl. The right one is `hotkey`, so it
# starts a recording and the tap then aborts it: nothing is transcribed
# and nothing happens, which is a confusing way to press a key twice.
hotkey = "right ctrl"         # hold = dictate Hebrew
# ON: `hotkey` above no longer declares "Hebrew" before the model has heard
# anything — the model decides per utterance, so one key covers both
# languages. Mixed sentences were already handled by [local] initial_prompt;
# this is for the utterance that is ENTIRELY English, the one case the
# Hebrew fine-tune transliterates ("Mac mini" -> "מקמיני").
#
# The earlier decision to pin the key to Hebrew rested on a single bad
# number — a Hebrew sentence once scored "English 0.57". Re-measured
# 2026-08-20 against the 50 real recordings in recent\, comparing what each
# model actually PRODUCED rather than trusting the label: 8 clips crossed
# the 0.8 bar, all 8 were genuinely English, 6 of them came out strictly
# better and 2 identical, and no Hebrew recording crossed it at all.
#
# Cost: one extra encoder pass per dictation, median 0.18 s (p90 0.26 s).
# The ~2 s first pass is spent at startup instead. false = back to Hebrew.
auto_language = true
# A dedicated English key, from before `auto_language` existed. Redundant
# now, and still here for anyone who would rather declare it by hand than
# let the model decide. If you set one, avoid "right alt" (releasing Alt
# alone pops the menu bar and steals focus right before the paste) and
# "right shift" (8 s hold triggers Windows FilterKeys).
english_hotkey = ""
# Holding a key is fine for a sentence and miserable for a paragraph. TAP
# this one WHILE still holding the hotkey and the recording LOCKS ON: let
# go of the hotkey and keep talking with no time limit, then tap it again
# to transcribe (or esc to discard). Pick a key the hand already on
# `hotkey` can reach without letting go — "left" (the left-arrow) sits
# right next to right ctrl. It is the one key the app swallows, and only
# while it is doing this job: idle, the arrow still moves the caret as
# usual. "" turns it off.
latch_hotkey = "left"
# TAP (don't hold) to turn what is already at the cursor into English:
# whatever is selected, or the whole field when nothing is selected.
# WAS BARE f9, which was never free and nobody noticed: Edge opens
# Immersive Reader on it, Excel for the web recalculates the workbook, and
# f9 is the breakpoint key in every IDE there is. Adding ctrl clears all
# three at once — ctrl+f9 is claimed by nothing in Chrome, Edge, any
# Google app, Word, Excel, PowerPoint, Outlook, Teams, WhatsApp Web,
# Spotify or the NVIDIA overlay. The finger does not move.
# "" turns it off. See [translate] below.
translate_hotkey = "ctrl+f9"
# TAP to put the PUNCTUATION into what is already at the cursor: whatever
# is selected, or the whole field when nothing is selected. Whisper
# transcribes sounds, not sentences — the local Hebrew model gives you a
# run of words with barely a comma or a full stop in it, and [polish] is
# forbidden from adding them (it may only fix MISHEARINGS), so nothing
# else puts them there either. So: dictate, read it, tap this. The words
# are guaranteed untouched — the reply is compared to your text letter by
# letter with the punctuation removed, and anything that changed a word is
# thrown away rather than pasted.
# WAS f7, which was the worst binding in this file. Bare f7 is Chrome's
# caret-browsing key and Chrome answers it with a MODAL DIALOG asking
# whether to turn caret browsing on, so every punctuate in the browser
# asked a question first; it is also Docs' spelling-and-grammar key and
# cmd's command-history popup. f2 does nothing whatsoever in Chrome or
# Edge — verified both ways, once with the page blocking the key and once
# letting it through. What does claim f2 claims it as "rename or edit what
# is selected" (Drive, Explorer, VS Code, Excel and PowerPoint on the
# web), and none of those is a place you punctuate dictated prose.
# "" turns it off. See [punctuate] below.
punctuate_hotkey = "f2"
# Fix the words it got wrong RIGHT WHERE THEY LANDED — in Chrome, in
# Claude Code, wherever you pasted — then TAP this key. It reads the
# corrected text off the screen, diffs it against what it produced, and
# feeds those words to the decoder from then on so it stops getting them
# wrong.
# There is no edit box on purpose: Tk 8.6 has no bidi support whatsoever,
# so a box showing mixed Hebrew and English renders scrambled and the
# caret jumps around as you type. You are already fixing the text in an
# app that renders Hebrew properly — reading it beats asking for it again
# in a worse editor. Select just the corrected sentence if the field holds
# a lot of other text.
# WAS BARE f8, and f8 was the one binding in this file that was already
# right. It moved only because the lookup key needed it more (see below).
# ctrl+f8 is free in everything measured, including the two places bare f8
# is not: a console, where f8 searches the command history, and VS Code,
# where it jumps to the next problem. Sharing a trigger with lookup is
# deliberate — both keys only READ the field, so a ctrl that did not
# register costs you a translation box instead of a lesson and changes
# nothing on screen.
# "" turns it off. See [vocab] below.
correct_hotkey = "f8"
# The key that looks something up without touching it. Select a word or a
# sentence, tap this, and a small box appears with the Hebrew — or with
# the English, if what you selected was already Hebrew. Nothing is typed,
# nothing is pasted, nothing on screen changes, and the box closes on Esc
# or on the x in its corner. It fires ONLY on this key and never on a
# selection: a box that appeared every time you selected something would
# also appear on the selection you made in order to delete it.
# WAS "j", which was indefensible in both directions. Every j you typed
# sent a ctrl+c into the focused app, opened a box and spent GPU time on
# it — and bare j is a Gmail shortcut (older conversation) and a Calendar
# one (next period) besides.
# It gets f8, the cleanest bare key on this keyboard, because it is the
# most-tapped of the four, the only one tapped mid-sentence with the other
# hand still on the mouse, and the only one where a bare binding's
# catch-all behaviour helps: it fires even with a stray modifier held.
# Nothing in Chrome, Edge, any of the seven Google apps, Word, Excel,
# PowerPoint, Outlook, Teams, WhatsApp Web, Spotify or the NVIDIA overlay
# binds f8.
# "" turns it off.
lookup_hotkey = "ctrl+f8"
# TAP to make every key above inert — without unloading anything. This is
# the key for "I am about to play a game and I do not want right ctrl
# starting a recording every time I hold it". Quitting the app does the
# same job and costs ~25 s of loading two Whisper models back onto the GPU
# to undo; this costs nothing in either direction, because nothing is
# unloaded.
# It is the ONE key that still works while paused (it has to be — a key
# that only worked while the app was listening could never turn listening
# back on), and it never means anything else. The phone endpoint keeps
# working: this pauses the KEYBOARD.
# "insert" is shipped, and it is the compromise it looks like. It costs
# you overtype in Word and most editors and the flag key in Outlook on the
# web, and it lives in the right-hand island — which is exactly wrong for
# a key tapped thirty times a day and exactly right for one tapped twice,
# deliberately, before a game. "scroll lock" is the cleaner key: nothing
# in any browser or any app measured here binds it at all, and many
# keyboards light it up, so the LED becomes the paused indicator.
# "" turns it off.
pause_hotkey = "insert"
# Pause by itself while a game or a presentation owns the whole screen, and
# resume when it lets go. OFF by default on purpose: it is the only setting
# here that can stop dictation working without anyone asking it to, and
# "my hotkey stopped responding" is a much worse half hour than tapping
# pause_hotkey yourself. Turn it on from the dashboard if you want it.
auto_pause_fullscreen = false
# local = unlimited, offline, ~0.3 s. Measured 2026-08-12 on 8 real Hebrew
# clips: local 10.8% WER / 0.38 s vs gemini 15.9% WER / 2.71 s. Switch to
# "gemini" if you ever want its stronger cleanup instead.
backend = "local"             # gemini | local | fake
paste_chord = "ctrl+v"        # try "shift+insert" for terminals that reject ctrl+v
restore_delay_ms = 300        # wait after pasting before restoring the old clipboard
min_seconds = 0.3             # shorter holds are treated as accidental taps and discarded
max_seconds = 400             # runaway-recording cap while HELD: stop, discard, error beep
latch_max_seconds = 0         # the cap once latched. 0 = none — max_seconds only
                              # guards against a key-up the OS swallowed, and a
                              # latched recording has no key-up to lose
fallback_to_local = true      # when every cloud model is out of quota, use local whisper
splash = true                 # show a small window while the models load (~25 s).
                              # Without it, clicking the shortcut looks like it did
                              # nothing, and the natural response is to click again
indicator = true              # small dot, top-right: blue = running, red = recording,
                              # red breathing = locked on, amber = transcribing.
                              # Click-through, so it never blocks the X button

[hint]
# The card that appears while you are still holding the key. It says what
# a release, the latch arrow and Escape will do, and lists the feature
# keys — the ones that are REFUSED at this instant greyed out WITH the
# reason. That is the whole point: mid-dictation those keys used to do
# nothing at all, silently, and a key that does nothing silently reads as
# a key that is broken.
enabled = true                # false = never show it. The "don't show this
                              # again" box on the card writes this line
after_ms = 400                # how long the key must be held before it appears.
                              # A short dictation never sees it — the card is
                              # for the press you hesitated on, which is exactly
                              # when someone has forgotten what the keys do
corner = "top-right"          # top-right | top-left | bottom-right | bottom-left.
                              # Where it starts before you have moved it. On the
                              # right it is placed BESIDE the status dot, never
                              # over it: the dot does not move for this
x = -1950                      # the top-left of the CARD where you last dragged
y = 241                       # it, in screen pixels — what you can SEE, not the
                              # window, which starts 26 px further up and left to
                              # leave room for its own shadow. -100000 = never
                              # moved: use `corner`. It has to be a number no
                              # desktop can reach, because a monitor to the LEFT
                              # of the primary has real negative coordinates
                              # (this one starts at x = -1920) and the -1 this
                              # used to mean threw every card dragged there away
scale = 0.9                   # how big you last made it (0.6 .. 1.4). The − and
                              # + on the card step this by 10% and save it

[setup]
# The first-run wizard: pick a microphone, watch the meter move, say one
# sentence, read it back. It runs ONCE per copy of the app.
#
# THE RECORD OF "IT HAS RUN" IS NOT HERE. It is `.setup-done`, a gitignored
# file beside this one, because it is a fact about one installation rather
# than a setting — and because this file is TRACKED: whatever is committed
# here is what a fresh download gets, so `true` would mean nobody ever sees
# the wizard and `false` would re-run it on every install that updated.
#
# This line is the override: true switches the wizard off without hunting
# for a dotfile. To see it again: run  main.py --setup
done = false

[audio]
sample_rate = 16000
device = "1"                  # Arctis 7 headset mic (from --list-devices; "" = system default)

[feedback]
enabled = true                # paste a marker at the cursor while transcribing
placeholder = "..."           # replaced by your text when it arrives
retry_seconds = 45            # keep retrying this long before spooling to pending\

[translate]
# Whisper only transcribes, so translating needs a language model. Gemini
# goes first (it keeps English technical terms in Latin script and holds
# the register); when its daily cap is spent this drops to a local Ollama
# model, so the key never becomes another thing that dies at 20 requests.
target = "English"
max_chars = 5000              # a guard: above this the key refuses, on the
                              # assumption ctrl+a caught a whole document
ollama_model = "llama3.1:8b"  # the fallback; must be pulled in ollama
# 127.0.0.1 and NOT localhost, and the difference is not cosmetic: this
# machine's getaddrinfo("localhost") hands back ::1 first, Ollama listens on
# IPv4 only, and the refused connection takes ~2.05 s to come back before
# Python retries the IPv4 address in under a millisecond. Measured 2026-08-19,
# three calls each: localhost 2078/2043/2059 ms against 127.0.0.1 21/15/5 ms.
# That toll was being paid by [polish] on EVERY dictation.
ollama_url = "http://127.0.0.1:11434"
timeout_s = 30                # gemini
ollama_timeout_s = 150        # ollama loads ~5 GB into VRAM on the first
                              # request after idling: 76 s cold, 2.5 s warm
                              # (measured 2026-08-12)
settle_ms = 120               # how long the focused app gets to answer a copy
                              # (the punctuate key reads this one too)

[punctuate]
# The comma-and-full-stop key. Same mechanics as [translate] — it grabs the
# selection or the whole field and replaces it — for the job Whisper does not
# do at all: it transcribes sounds, not sentences.
#
# The words are guaranteed untouched, and not just asked for: punctuate.py
# strips every non-letter from the reply AND from your text and demands they
# be identical. A model that rewrote a word, dropped a hesitation, translated
# a term or answered your text instead of punctuating it fails that check and
# its reply is discarded — your text stays exactly as it was.
max_chars = 5000              # same guard as translate.max_chars: with nothing
                              # selected this takes the WHOLE field
prefer = "gemini"             # gemini | ollama. Measured on real dictations
                              # 2026-08-15: gemini put in every comma, full
                              # stop and question mark and took 0.6-3.2 s;
                              # llama3.1:8b passed the safety check too but
                              # came back with only a full stop on one of the
                              # two, and took 17.7 s on the first request
                              # after idling, 3.6 s after. So gemini first —
                              # "is this a question?" is a judgement call, and
                              # this is a key you tap rather than something
                              # that runs on every dictation.
                              # Switch to "ollama" if you end up tapping it
                              # after EVERY dictation: the free tier is 20
                              # requests/day/model and translation draws on
                              # the same bucket
ollama_model = ""             # "" = reuse [translate] ollama_model
nikud = false                 # also add Hebrew VOWEL POINTS, not just
                              # punctuation. A much bigger change to the text;
                              # the same letter-for-letter check covers it,
                              # because nikud are combining marks and drop out
                              # of the comparison exactly like a comma does

[lookup]
# THE BOX, first, because there is no knob for any of it and this is the
# file you read. It never takes focus, so whatever you were typing into
# keeps the caret and you can go on typing with the answer up. It is
# dragged by its TITLE BAR and by nothing else — except resized by the
# diagonal grips in BOTH bottom corners (pull outward, either hand): the
# frame may be grown to the full screen and the text zooms with it; the
# rest of the body stays text to be selected, the way every other window
# on this machine works. The bar
# names the word that was looked up, so an answer read an hour later, or
# dragged away from the sentence it came from, still says what it is
# answering. The button beside the x copies the whole answer; drag over
# the lines you want and a second button appears that copies only those,
# or press Ctrl+C. A copy made in the box SURVIVES — no other key in this
# app will put your old clipboard back over it, however long its model
# takes to answer. The box closes on the x or on Esc, and on nothing
# else: see dwell_ms below for why nothing takes it away on a timer.
#
# An answer taller than max_height is NOT cut off any more — not while
# anything helps, anyway: the whole layout is first re-measured at
# smaller faces (19 px down to an 11 px floor) until everything fits.
# Only past that floor does the ellipsis trim take over, and it trims the
# floor-sized layout, so more of the answer survives than ever used to.
# Enlarging the box afterwards can bring back even what was cut: the
# resize re-fits the FULL answer, and a new lookup forgets your size
# exactly as it forgets where you dragged the last one.
#
# Which way to translate is decided per selection, by counting WORDS and
# not letters. "תעשה commit לפני ה-merge" is 9 Hebrew letters against 11
# Latin ones, so a letter count calls that sentence English; Hebrew is
# written without vowels, which makes words the only fair unit. At or above
# this share of Hebrew words the selection goes to English, below it to
# Hebrew. Ties go to Hebrew-as-target. Reasoned and test-covered, not tuned
# on a corpus.
hebrew_share = 0.34

# Both directions, or Hebrew only. Off, a Hebrew selection plays the "there
# was nothing to do" note instead of coming back as English.
both_ways = true

# Over this, the key refuses and spends nothing. WAS 5000 — the owner
# kept hitting it with select-all on a page ("it didn't translate"). Now
# long selections are fed to the local model in ~3800-char parts, with
# the box showing which part is being translated, so select-all works
# within reason. Still a ceiling, for two honest reasons: minutes of
# local model time at this size, and past it even the parts would run
# into Ollama's default context window and degrade silently. For a whole
# document you still want F9.
max_chars = 20000

# Which backend goes first, and this is deliberately the OPPOSITE of
# [translate] and [punctuate]. The free Gemini tier is 20 requests per
# model per day across 4 models — about 80 — and app.log shows F9 and F7
# alone spending 34 / 39 / 17 / 18 of them on working days and running into
# 429s on seven separate days. This key is tapped while READING, costs you
# nothing to press, and would plausibly run 30-60 times a day; sent to the
# cloud first it would take the whole pool and break the two keys whose
# local fallback is the weak one. Measured warm over 127.0.0.1, gemma3:12b
# answers a word in 1.9-3.1 s and a sentence in 1.0-2.0 s — about a second
# behind Gemini's 0.8-1.3 s, and free.
prefer = "ollama"

# Already resident for [polish] (warm_up, when = "always"), and Ollama
# serves one copy to every caller, so this costs no extra VRAM: nvidia-smi
# showed 14689 of 16311 MiB in use with it and Whisper both loaded. Do not
# put qwen2.5:7b here — measured, it returned '?");' for "brittle",
# ".FactoryReset" for "Restore Defaults", and one sample with its meaning
# inverted.
#
# Three faster models were then measured properly, on the same 10 real
# selections in both directions (2026-08-19), and all three were rejected
# for the same reason: they are quicker at being wrong on the ONE line you
# read.
#   gemma3:4b       0.75 s a word, half the time — and 3 headlines in 10
#                   wrong: "brittle" -> "שבור" (broken, not brittle),
#                   "idempotent" -> "חזרתי" (repetitive), and the question
#                   "מה שלומך היום" -> "Hello".
#   aya-expanse:8b  invents parts of speech outside the closed list on
#                   nearly every word, coins "ידועת-מפעול" for
#                   "idempotent", and on 2 in 10 omits the headline line
#                   altogether — the whole point of the box.
#   dictalm2.0      genuinely fast (0.19 s to the first line) and unusable:
#                   never writes the headline-first shape, and on 3 in 10
#                   echoed this file's own prompt rules back into the
#                   answer, where the box would have shown them to you.
# gemma3:12b was the only one of the four that got the headline right and
# held the shape every time.
model = "gemma3:12b"

# If the model is not resident, Ollama loads it first: 24.4 s to the first
# token, 25.3 s in total. Rather than make you watch that, a cold model
# sends this one lookup to the cloud and warms the local one in the
# background. Bounded at about one cloud request per idle keep_alive
# period, and any dictation resets that clock because [polish] keeps the
# same model alive.
cold_to_gemini = true

# How long Ollama holds the model after a lookup. It matters because
# Ollama's own default is FIVE MINUTES and nothing here used to override
# it, so the model fell out from under any reading session that had no
# dictation in it: measured 2026-08-19, /api/ps said the model expired at
# 21:43:36 after the last dictation at 21:38:36, and the next lookup nine
# minutes later paid 23.19 s. That is the wait this line removes, and it
# costs nothing — it is one field on a request that was being sent anyway.
#
# READ THIS BEFORE CHANGING IT: keep_alive belongs to the loaded RUNNER,
# not to the request. Verified on Ollama 0.32.11 — after one request sets
# it, later requests that say nothing about it re-arm the timer at the
# retained value, not at the five-minute default. So this line is also
# [polish]'s keep_alive, and F9's, and F7's, because all four ask the same
# model. That is the intent (polish currently gets five minutes and pays
# ~23 s after any real pause), but it is one key deciding for four, which
# is why the knob is here to put it back.
#
# 30m rather than 8h because gemma3:12b is 7672 MiB of a 16 GB card and
# Whisper wants the rest: half an hour covers a reading session and a
# meeting, and lets the VRAM go if you walk away to play something (see
# pause_hotkey). Raise it to "8h" if this machine never does anything
# else. A plain number is seconds, "-1" holds it until Ollama stops, and
# "" says nothing at all and leaves Ollama on its own default.
keep_alive = "30m"

# gemma3:12b writes plain Hebrew and then, on a particular input, falls
# into fully vowel-pointed transliteration for the whole line: "The
# decoder loops on a hesitation and eats the words after it." came back
# as "הדקוּדר עוֹלֶה בלופּ על היסוֹר וְאוֹכֵל את המילים אחריו." It is not
# random but INPUT-specific, which is what makes it worth fixing:
# measured 2026-08-19, 3 runs in 12 across four inputs — that is 3 of 3
# on that one sentence and 0 of 9 on the rest — and 4 of 4 on it when
# measured again. The prompt cannot reach it (adding "Never add niqqud"
# to the rules gave 2 in 12 instead of 3, i.e. noise), so it is stripped
# from the answer instead, where it is 4 of 4 the other way. Maqaf is
# left alone — dropping that would weld "בית־הספר" into one word. Set
# false if you want the vowels; the key that adds them on purpose is
# [punctuate] nikud, and that one writes into your own text.
strip_niqqud = true

dwell_ms   = 12000  # DEAD. Nothing reads this any more — main.py passes a
                    # literal 0. The box waits to be closed, by the x in
                    # its corner or by Esc, because a box that took itself
                    # away on a timer was indistinguishable from one that
                    # vanished because of a bug, and that was the
                    # complaint. Still parsed and still validated so an
                    # old config file does not fail to load.
max_width  = 460    # pixels. 60 words wrapped to 9 lines measured 512 px
max_height = 520    # unbounded, and a 22-sentence paragraph made a 896 px
                    # tall window — taller than some work areas. Both cap
                    # what the box OPENS at; past them the face shrinks
                    # (19 px down to an 11 px floor) before an ellipsis
                    # trims anything, and a hand-dragged grip overrides
                    # both for that one answer

# Answers are stable — "brittle" means the same thing tomorrow — and
# lookups repeat across days, which is the whole point of the key, so they
# are kept in lookup_cache.json next to vocab.json and survive a restart.
# Measured 134 bytes an entry: 500 of them is about 67 KB. A repeat costs
# 0.0 s instead of 2.3 s and one saved request. Only selections under 200
# chars are kept; a paragraph translation is a one-off that would bloat the
# file for nothing.
cache_entries = 500

# Windows Terminal turns the copy into a real Ctrl+C for whatever is
# running there when nothing is selected — reproduced 5 times out of 5, and
# ctrl+shift+c interrupts too, so there is no safe chord to use instead.
# With this on, the key refuses in console windows rather than killing your
# build. VS Code's integrated terminal does not announce itself as a
# console and is not covered.
skip_consoles = true

[visual_qa]
# ASK THE SCREEN: tap the key, every monitor dims, drag a rectangle over
# anything — a paragraph in a browser, an error dialog, a chart — and a
# small window opens showing what was captured plus a question box. Hold
# right ctrl and SPEAK the question (the same Whisper path as dictation,
# routed into the box instead of pasted at the cursor) or just type it.
# The screenshot goes, base64 from RAM, to a vision model together with
# your question; the Hebrew answer lands under it with Copy and Speak
# buttons. Follow-up questions reuse the SAME screenshot plus the Q/A so
# far — measured 2026-08-25, Ollama caches the prompt prefix and answers
# a follow-up turn in ~0.35 s against ~4 s for the first.
#
# PRIVACY IS THE DESIGN HERE, not a preference. A screenshot can hold
# mail, banking, anything ever shown on this screen, which makes it
# strictly more sensitive than transcript text (the one thing [polish] may
# already send out). So the default chain is LOCAL ONLY and
# allow_screenshot_upload below defaults to FALSE, where false does not
# mean "cloud second" — it means the cloud backends are never even built,
# enforced in visual_qa.py's chain builder and asserted by a test. With
# the gate shut and Ollama down, the window says so instead of falling
# through to the cloud on its own initiative. The screenshot is never
# written to disk, never logged, never cached — the screen changes between
# presses, so there is nothing worth caching — and it dies with its window.
#
# Everything latency-related below was measured live on this machine on
# 2026-08-25 rather than taken from anyone's documentation:
#   ImageGrab.grab(bbox), full virtual screen   47-57 ms
#   resize 4480x1440 -> long side 1344          61 ms, JPEG q85 ~105 KB
#   gemma3:12b vision, first image of session   22.6 s cold (the vision
#     projector loads once; warm_up below pays it at startup)
#   gemma3:12b vision, warm                     3.9 s @900x450 region,
#                                               5.7 s whole-screen@1344
#   Groq qwen/qwen3.6-27b                       0.48-0.51 s, but ~830
#     prompt tokens for one modest image against an 8000 tokens/min cap:
#     real screenshots are 1-2 requests a MINUTE before HTTP 429
#   Gemini 2.5-flash-lite                       2.2-2.3 s, from the shared
#     20 req/day/model pool that F9 and F7 also drink from
enabled = true                 # false unregisters the hotkey entirely
                               # — the kill switch
visual_qa_hotkey = "ctrl+f10"  # measured-free like the other ctrl+F keys:
                               # everything the 2026-08 probe pressed
                               # (f1-f6, f10-f16 under ctrl) reached the
                               # page untouched in Chrome and Edge. Rebind
                               # from the dashboard like any other key.
allow_screenshot_upload = false
                               # NAMED SO NOBODY CAN MISREAD IT. false = no
                               # cloud backend for screenshots exists, full
                               # stop. true turns the chain into ollama ->
                               # groq -> gemini-pool. The trade if you flip
                               # it: pixels leave the machine under Groq/
                               # Google's terms, in exchange for speed when
                               # the local model cannot answer.
prefer = "ollama"              # ollama | groq | gemini — who asks first;
                               # the others follow underneath when allowed,
                               # ollama always among them, exactly the
                               # [polish] prefer shape
ollama_model = "gemma3:12b"    # the repair model this app already keeps
                               # resident IS a vision model (it reports
                               # capabilities ['completion','vision']) —
                               # no new pull, no new VRAM residency:
                               # nvidia-smi read 14710/16311 MiB with both
                               # Whisper models AND this loaded, nothing
                               # evicted. Do NOT put qwen2.5:7b here
                               # without measuring: lookup.model tried it
                               # for text and got '?");' for "brittle".
groq_model = "qwen/qwen3.6-27b"
                               # llama-4 scout/maverick were the obvious
                               # picks and are GONE from Groq's catalog
                               # (their catalog drifts; list /v1/models
                               # before trusting a name). This one is a
                               # reasoning model whose knob differs from
                               # gpt-oss: reasoning_effort takes ONLY
                               # "none"/"default" — "low" is HTTP 400 — and
                               # its endpoint sits behind Cloudflare, which
                               # 403s Python's default User-Agent (error
                               # 1010); translate.py::USER_AGENT answers
                               # that. Handled inside visual_qa.py.
gemini_fallback = true         # include the shared pool after Groq when
                               # uploading is allowed. It answered an image
                               # question in 2.2-2.3 s, but it drinks from
                               # the same 20 req/day/model bucket as F9/F7
                               # — see [lookup] prefer for what happens
                               # when a casual key shares that bucket
max_side_px = 1344             # cap the screenshot's LONG side before
                               # sending. 1344 because gemma3's image
                               # encoder works in tiles up to about that
                               # size — bigger buys no detail, only bytes.
                               # Measured: a full 4480x1440 screen resized
                               # to 1344 costs 61 ms and answers warm in
                               # 5.7 s against 3.9 s for a 900x450 REGION —
                               # small selections stay fast precisely
                               # because this knob keeps big ones bounded.
                               # Never upscales: a 400 px grab stays 400 px
num_predict = 400              # hard reply cap. Answers here are generated
                               # text, NOT your words — polish._is_safe's
                               # word-diff deliberately does not apply — so
                               # this cap is what stops a rambling model
                               # hanging the window. 64 is the floor config
                               # accepts; honest Hebrew paragraphs fit in
                               # ~200 tokens at 42-46 tok/s
speak = "button"               # off | button | auto — whether the answer is
                               # READ ALOUD in Hebrew. button shows a Speak
                               # control (press again to stop); auto reads
                               # every answer as it lands; off hides the
                               # control entirely
voice = "Microsoft Asaf"       # he-IL. CAUTION: the legacy SAPI
                               # System.Speech API does not SEE the OneCore
                               # voices (it lists only Zira en-US here);
                               # WinRT SpeechSynthesizer does. Synthesis is
                               # therefore a PowerShell subprocess over
                               # WinRT writing a WAV to a temp file that is
                               # deleted after playback (winsound, async).
                               # Measured: 30 ms to synthesize a 5.9 s clip
auto_send = true               # a SPOKEN question sends itself the moment
                               # the transcript lands — the Enter after
                               # speaking was the one manual step left in a
                               # flow that is otherwise hands-free. It also
                               # turns speaking again into a BARGE-IN: the
                               # answer in flight is abandoned, what you
                               # just said is appended to what you already
                               # asked, and the model answers all of it in
                               # one reply. false restores type-or-speak,
                               # then Enter, for editing before sending
echo_to_field = true           # a question you SPEAK to the card is also
                               # pasted into the field you were dictating
                               # into, once the card closes. The card is
                               # opened mid-sentence more often than not —
                               # you are writing to somebody, you ask the
                               # screen something, and what you asked is
                               # part of what you were saying. It could not
                               # be pasted WHILE the card is up: the card
                               # owns the foreground, so the paste would
                               # land in the card or steal focus off it.
                               # false keeps a question a question. This
                               # only chooses which way the switch STARTS:
                               # the card carries it in its title strip (a
                               # text field, struck through when off) so
                               # the one question that has no business in
                               # what you are writing can be excused
                               # without leaving the card. Asked per
                               # question, so turning it off never
                               # un-sends what you already said, and it is
                               # in transcripts.log either way
window_alpha = 0.93            # how SOLID the blue glass is. It used to be
                               # Tk's whole-window -alpha, which made the
                               # TEXT translucent too — popup.py had already
                               # measured that trade ("ClearType over a
                               # translucent window is exactly where Hebrew
                               # stops being crisp") and it was half of why
                               # the old card was hard to read. The card is
                               # opaque pixels now and the see-through is
                               # PAINTED into them, so the glyphs stay crisp
                               # at any setting. Lower = more of your screen
                               # shows through the blur; 1.0 is nearly solid
warmup = true                  # one dummy-image, num_predict=1 call at
                               # startup, in the background, so the first
                               # real question costs ~4 s instead of the
                               # 22.6 s projector load
ollama_timeout_s = 120         # generous on purpose: a COLD local model can
                               # spend minutes loading ([translate]
                               # measures 76 s for a text-only load), and
                               # there is no cloud fallback while the
                               # upload gate is off
cloud_timeout_s = 30           # Groq answers in half a second and Gemini in
                               # ~2 s when they are healthy; past 30 s they
                               # are not, and the next backend should have
                               # the work

[capture]
# SCREENSHOTS AND SCREEN RECORDINGS — Win+Shift+S, plus the editor, plus a
# recorder, and none of it leaves this machine.
#
# Tap `capture_hotkey` and the screen freezes and dims: drag a box, or hold
# Shift and lasso a shape (the same gesture the ask key uses, because it is
# the same hand). Let go and the picture is ALREADY on your clipboard —
# that half is not negotiable and never was.
#
# WHAT DOES NOT HAPPEN NEXT is the point. The editor used to open over the
# whole screen every single time, for a picture that nine times out of ten
# was going straight into a chat window: a modal dialog in nicer clothes,
# making the common case pay for the rare one. Now a small card appears in
# a corner for `toast_seconds` with a thumbnail of what you took, and the
# editor is one click away on it — crop, draw, arrow, highlight, blur out
# an address, undo, copy again, save, or hand the whole thing to the ask
# key. Ignore the card and it goes away and the clipboard keeps the
# picture. `after_shot = "editor"` restores the old behaviour.
#
# Tap `record_hotkey`, pick a region the same way, and it records to mp4
# until you tap the key again. The bar that shows the clock does NOT appear
# in the recording (SetWindowDisplayAffinity — see below), so it can sit on
# top of what is being recorded instead of beside it.
#
# PRIVACY. Unlike [visual_qa], whose screenshot lives in memory and is
# never written down, this feature exists to write pictures of your screen
# to disk. So `folder` is treated the way transcripts.log is: beside the
# app, gitignored, and never uploaded by anything in capture.py. The only
# route from a capture to a model is the editor's Ask button, which hands
# the pixels to the ask card and obeys allow_screenshot_upload above.
#
# MEASURED ON THIS MACHINE, 2026-08-25, live:
#   grab, reused DIB + BitBlt      10.1 ms at 720p · 21.7 ms at 1440p
#   the same rectangles via PIL    53.7 ms · 56.7 ms  (5x slower, which is
#                                  the whole reason a recorder is possible)
#   encode, libx264 veryfast        5.1 ms at 720p · 20.9 ms at 1440p
#   achieved                       30.0 fps at 720p and 1080p, 0 dropped
#                                  28.0 fps at 1440p, 0 dropped
#   clipboard (CF_DIB + PNG)       43 ms to encode, 0.4 ms to write
#   controls hidden from capture   0 of 60000 pixels of a window that was
#                                  demonstrably there
# The encoder is PyAV, which faster-whisper already installs — no new
# package, no ffmpeg.exe, nothing to keep up to date.
enabled = true                 # false unregisters BOTH keys entirely
                               # — the kill switch
capture_hotkey = "win+shift+s" # THE SAME KEY WINDOWS USES, taken from it.
                               # A Windows-key chord is the one kind of
                               # binding this app SWALLOWS — every one of
                               # them is a shortcut the shell already
                               # answers, so letting it through would open
                               # the capture overlay AND the Snipping Tool.
                               # Measured 2026-08-26, three runs: with the
                               # 's' eaten by the hook the Snipping Tool
                               # never appears, and a bare tap of Win still
                               # opens Start, because Win itself is never
                               # touched. Nothing has to be turned off in
                               # Windows and no registry key is involved.
                               # ctrl+f11 is still free if you want it back
                               # (the 2026-08 probe found f1-f6 and f10-f16
                               # under ctrl reaching the page untouched in
                               # Chrome and Edge). Rebind from the dashboard
record_hotkey = "ctrl+f12"     # tap to start, tap again to stop. One key
                               # for both because the second press is the
                               # same thought as the first, and a recorder
                               # you have to hunt for with the mouse records
                               # you hunting for it
folder = "captures"            # relative to the APP folder, not to whatever
                               # directory the process started in — this app
                               # is launched from a .vbs, a shortcut and a
                               # scheduled task, and all three disagree.
                               # An absolute path is used as given
copy_to_clipboard = true       # Win+Shift+S's promise. CF_DIB and the
                               # registered PNG format, so Paint, Word,
                               # Chrome and Slack all find one they like and
                               # a lasso keeps its transparency
after_shot = "toast"           # toast | editor | nothing. What happens when
                               # you let go of the mouse. "toast" puts a
                               # small card in a corner with a thumbnail
                               # and the editor one click away; "editor"
                               # opens the editor immediately the way this
                               # key used to; "nothing" makes it a pure
                               # grab-and-get-out-of-my-way
toast_corner = "bottom-right"  # top-left | top-right | bottom-left |
                               # bottom-right. Its own setting and not
                               # timer_corner's, because the recording pill
                               # and the capture card can want different
                               # corners on the same desk. The corner of
                               # the WORK area of the monitor the capture
                               # was taken on, so it is never under a
                               # taskbar and never on the wrong screen
toast_seconds = 5              # how long the card waits before giving up
                               # on you. The clock PAUSES while the pointer
                               # is on it — a card that vanishes while the
                               # hand is reaching for it is worse than no
                               # card at all
always_save = false            # write EVERY capture to `folder`, or only
                               # the ones you ask to keep.
                               #
                               # This is the one setting here that gives
                               # something up: with false the picture is on
                               # the clipboard and NOWHERE ELSE until Save
                               # is pressed, so copying something else
                               # inside those five seconds loses it. The
                               # trade is a folder that holds the captures
                               # you meant to keep instead of every
                               # rectangle you ever dragged — and this
                               # folder is the most sensitive thing in the
                               # repo, so a smaller one is worth something
                               # on its own. true restores the old promise
                               # exactly: on disk before you let go
copy_clip_path = true          # a finished recording goes on the clipboard
                               # as a FILE (CF_HDROP), so it pastes into a
                               # chat or a folder the way Explorer's Copy
                               # does. A video has no useful bitmap form
fps = 30                       # measured achievable with zero dropped
                               # frames at 720p and 1080p. A 1440p region
                               # falls to ~28 because the GRAB costs 32 ms,
                               # and the clip is still real-time: every
                               # frame carries a wall-clock stamp rather
                               # than a frame number, so a slow grab makes a
                               # slightly choppier video and never a faster
                               # one
quality = "balanced"           # small | balanced | sharp — crf 30/26/20.
                               # Screen content is flat colour and sharp
                               # edges, which h264 likes, so these are
                               # several steps softer than the same names
                               # would mean for camera video
cursor = true                  # BitBlt does not include the pointer (the
                               # compositor draws it over everything, not
                               # into the screen bitmap), so it is painted
                               # in. Without it nobody can tell what is
                               # being pointed at
audio = "off"                  # off | mic. OFF BY DEFAULT ON PURPOSE: a
                               # screen recorder that quietly opens the
                               # microphone is a surprise, and this app's
                               # rule is that audio does not travel. With
                               # "mic" the clip gets a track from the same
                               # microphone dictation uses (two shared-mode
                               # streams on one device were verified working
                               # here), and the bar grows a mute switch —
                               # mute rather than remove, because an mp4
                               # declares its streams when the container
                               # opens and a track cannot be added later
max_minutes = 30               # a backstop, not a budget: a key tapped by
                               # accident should not fill the disk
                               # overnight. 0 = no cap
timer_corner = "bottom-right"  # top-left | top-right | bottom-left |
                               # bottom-right | off. Where the little
                               # red-dot-and-clock pill sits while a
                               # recording runs. A CORNER and not "beside
                               # the region", because an indicator that
                               # moves when the region does is an
                               # obstruction — and the corner is of the
                               # WORK area of the monitor the region is on,
                               # so it is never under a taskbar and never
                               # on the wrong screen. It is hidden from the
                               # capture, so a corner inside the recorded
                               # area is fine. "off" = no pill; the
                               # recording is still announced and the key
                               # still stops it
announce = true                # say "Recording started" for 2.6 s before
                               # shrinking to the pill. The failure mode of
                               # a screen recorder is not knowing whether
                               # it is running, and this is the cheapest
                               # possible answer to that

[camera]
# A PHOTO FROM THE WEBCAM — the same folder, the same editor, a different
# lens. Tap `camera_hotkey` and a card opens in the middle of the screen
# with the live picture in it and a shutter under it. Space, Enter or the
# button takes it; `t` cycles a self-timer; `m` mirrors; `c` moves to the
# next camera when there is one; Esc closes without taking anything.
#
# The picture is on your clipboard and in `folder` the instant the shutter
# fires — the same promise `capture_hotkey` makes, and just as
# non-negotiable — and THEN it opens in the screenshot editor, laid on the
# screen exactly where the preview was, so you can crop it, draw on it,
# blur something out or hand it to the ask key.
#
# PRIVACY. This is the only thing in the app that opens the camera, and it
# opens it for as long as the window is up and not a moment longer: the
# device is released the instant the shutter fires, not when the editor
# closes, so the light beside the lens means what it looks like it means.
# The photo is written to `folder` beside the app, gitignored, and nothing
# here uploads anything anywhere. The one route from a photo to a model is
# the editor's Ask button, which obeys visual_qa.allow_screenshot_upload
# like every other question. `enabled = false` unregisters the key.
#
# MEASURED ON THIS MACHINE, 2026-08-26, live, on an eMeet C960:
#   open -> first frame         654-829 ms over six opens (so the card
#                               says "waking ..." rather than sitting
#                               black for three quarters of a second)
#   delivered                    25 fps at 1280x720 mjpeg, 40.1 ms
#                                between frames and steady to a tenth
#   one frame to the window       5.4 ms at 800x450, 4.3 ms at 1280x720
#   listing the devices         147 ms, paid once when the window opens
# The decoder is PyAV, which faster-whisper already installs — the same
# one that encodes the screen recordings. No OpenCV, no new package.
enabled = true                 # false unregisters the key entirely
                               # — the kill switch
camera_hotkey = "ctrl+f6"      # measured-free like the other ctrl+F keys:
                               # the 2026-08 probe found f1-f6 and f10-f16
                               # under ctrl reaching the page untouched in
                               # Chrome and Edge. Rebind from the dashboard
device = ""                    # which camera, matched as a case-insensitive
                               # SUBSTRING of the name Windows knows it by
                               # — "eMeet" is enough, and nobody retypes
                               # "HD Webcam eMeet C960" without a typo.
                               # Empty = the first device DirectShow lists
                               # that is not a VIRTUAL camera: OBS, Teams
                               # and NVIDIA Broadcast all install one and
                               # they sort ahead of the real webcam as
                               # often as not (here OBS is second of two)
size = "1280x720"              # what the camera is asked for, as MJPEG.
                               # ASK FOR MJPEG is not a preference: this
                               # camera offers 1920x1080 at 30 fps as
                               # mjpeg and the SAME size at 5 fps as raw
                               # yuyv422, and DirectShow hands over the
                               # raw one unless it is told otherwise. A
                               # camera with no mjpeg pin is asked again
                               # for whatever it has, and that is logged
fps = 30                       # what it is asked for. A webcam that
                               # cannot manage it simply sends fewer —
                               # this one settles at 25 in this room,
                               # because the exposure it wants is longer
                               # than a thirtieth of a second
mirror = false                 # mirror BOTH the preview and the file, or
                               # neither. Off by default because the
                               # commonest thing anyone holds up to a
                               # webcam has writing on it, and mirrored
                               # writing is unreadable. `m` flips it while
                               # the window is open. There is deliberately
                               # no "mirror the preview only": a preview
                               # that disagrees with the file it produces
                               # is the one bug this whole feature is
                               # written to avoid
timer = 0                      # 0, 3 or 10 seconds of self-timer to start
                               # on. `t` cycles it while the window is
                               # open, and Esc cancels a countdown before
                               # it closes the window
folder = "captures"            # the same folder the screen captures go
                               # to, so there is one place to look for
                               # pictures. The files are named
                               # "photo 2026-08-26 18-45-22.png" rather
                               # than "shot ...", so sorting by name still
                               # groups them
copy_to_clipboard = true       # on the clipboard the moment it is taken,
                               # as CF_DIB and PNG, exactly like a
                               # screenshot
edit_after_shot = true         # open the photo in the screenshot editor,
                               # on the pixels where the preview was, so
                               # the picture never moves. false makes the
                               # key a pure "take it and get out of my
                               # way" — the file and the clipboard are
                               # identical either way

[server]
# Dictate from the PHONE, transcribe on this GPU: the phone records and
# posts the audio here, so you keep the Hebrew fine-tune instead of falling
# back to whatever the phone's keyboard offers. Runs inside this app and
# borrows the model that is already loaded.
# Reachability is Tailscale's job — see the README. host = "" binds to the
# Tailscale address when it is up (and 127.0.0.1 when it is not), so this
# never answers the home LAN.
enabled = true
host = ""
port = 8756

[vocab]
# The names Whisper has never heard, fed to the decoder BEFORE it runs so it
# never produces the garble in the first place. This is the half of "learning"
# that actually matters — repairing afterwards is the safety net.
#
# Why this exists as a separate mechanism from [local] initial_prompt, measured
# 2026-08-14 by spying on WhisperModel.get_prompt over 125 s of real speech:
# with condition_on_previous_text=false (which the app sets), initial_prompt is
# DROPPED after the first 30-second window — it survived in 1 of 5 windows —
# while hotwords is re-injected per window and survived in 6 of 6. Long
# dictations are exactly where names garble worst, so the vocabulary has to
# travel by the mechanism that reaches them. Both are used; they coexist.
enabled = true
max_terms = 40            # kept well under faster-whisper's 223-token hotword
                          # ceiling: Hebrew costs several tokens a word, and
                          # over-prompting Whisper makes it emit the prompted
                          # words unbidden. A longer list is not a better one
replace_after_hits = 2    # how many times the SAME garble must be corrected
                          # before it is also repaired automatically. 1 would
                          # let one slip in the correction box start rewriting
                          # a word you really say
keep_audio = 50           # keep this many recent recordings in recent\, so a
                          # correction can be tied to the AUDIO that produced
                          # it. That is what makes `main.py --benchmark` able
                          # to prove a vocabulary change helped instead of
                          # leaving it to impressions.
                          # PRIVACY: raw audio of what you dictated, on this
                          # disk. Gitignored, capped, oldest dropped first.
                          # 0 keeps none — everything else still works, you
                          # just lose the ability to measure.

# Seeds: your own stack, written by hand. Anything you correct with the
# correction key is added to vocab.json automatically and ranks alongside
# these. Real mishearings from transcripts.log that these are here to stop:
# "Expo Go" -> "xpogo", "--branch" -> "Brinth", "Cowork" -> "בקו-ורק",
# "HebrewDictation" -> "Hebrew reduction", "Play Protect" -> "PlayProtect Scance".
terms = [
  # this machine's projects
  "HebrewDictation", "Massif", "TripSync", "Cowork",
  # the toolchain that keeps coming out wrong
  "Expo", "Expo Go", "EAS", "npx", "APK", "Gradle", "Android Studio",
  "Play Protect", "GitHub", "Tailscale", "Ollama", "Claude Code", "Whisper",
  # git/dev terms — also in [local] initial_prompt, repeated here because
  # that one stops reaching the decoder after 30 seconds
  "commit", "branch", "pull request", "merge", "deploy", "production",
  "repo", "terminal", "bug", "feature", "prompt", "config",
]

[study]
# FAST VERSION ONLY -- classic ignores this whole section, like [local]
# beam_size. The second learning channel (study.py): the correction key
# teaches only when you stop to teach, and most dictations are sent and
# forgotten. When the app has been idle a while, this pass takes a
# recording from recent\, decodes it three MORE ways on the local models
# (wider beam, the general model, a looser temperature -- audio never
# leaves the machine), lets the decodes vote, and has a language model
# adjudicate the words they disagree on. Where the verified reading
# differs from what was pasted, the live pass was probably wrong -- and
# that pair is machine evidence for the vocabulary.
#
# Machine evidence is weaker than a correction you typed, ON PURPOSE:
# it becomes a hotword only after the same pair shows up in 2 DIFFERENT
# recordings, pure-Hebrew pairs feed the polish glossary only (never
# hotwords -- prompting Whisper with common real words makes it emit
# them unbidden), and nothing machine-learned ever rewrites text
# automatically (vocab.py gates auto-replacement on HUMAN hits alone).
#
# The adjudicator sends candidate TEXT to the polish backends (Groq
# first, local fallback) -- the same accepted trade as [polish], and it
# spends the same ~1,000/day Groq bucket, capped well below it here.
enabled = true
idle_minutes = 3          # study only after this long with nothing happening;
                          # the pass also steps aside mid-clip the moment a
                          # key goes down, so a dictation waits at most one
                          # decode of the model lock (~0.5-2 s), not three
max_clip_seconds = 120    # skip longer clips: three extra decodes of a very
                          # long recording buy little extra evidence
llm_per_day = 60          # LLM adjudications a day (one per studied clip).
                          # Learning requires the adjudicator's assent —
                          # measured 2026-08-27, the acoustic vote alone
                          # learns orthographic wobble — so past this cap
                          # clips simply wait for tomorrow's budget
corpus_keep = 400         # verified (audio, text) pairs kept in corpus\ as
                          # future fine-tuning data (~1 MB per 30 s clip;
                          # 400 is roughly 3-4 hours of this voice). The
                          # long game: enough of these becomes a LoRA
                          # fine-tune of the local model on YOUR speech.
                          # PRIVACY: raw audio on this disk, gitignored,
                          # capped, oldest dropped first. 0 keeps none.

[polish]
# The context pass: the half that vocab CANNOT do. Some mishearings swap a real
# Hebrew word for another real Hebrew word — מקלדת -> מקללת, סריקה -> סירקה,
# קירור -> קירוב — and no lookup table can fix those safely, because the heard
# form is a word you might genuinely have said. Only the sentence around it
# disambiguates. So a language model reads the sentence and fixes the word.
#
# It is allowed to read context. It is NOT allowed to write. The instruction not
# to invent is in the prompt AND enforced in code (polish.py::_is_safe): every
# reply is diffed against the transcript and THROWN AWAY if the model did more
# than swap words — >15% change in word count, or <75% of the words surviving.
# A rejected reply is not retried; the raw transcript goes through untouched.
#
# NO GEMINI HERE, unlike [translate] and [punctuate], and that rule has never
# moved. This runs on dictations (dozens a day) rather than on a key you tap,
# so a stopped backend falling back to Gemini would burn the 20/day/model free
# tier before lunch and take F9 and F7 down with it. Those are keys you press
# on purpose; this is a pass you never asked for on any particular sentence,
# and it does not get to starve them.
#
# What DID move is that the pass is no longer local-only: see `prefer` below.
# Groq is a different provider with its own bucket that nothing else in this
# app draws on, so it cannot starve anything, and it answers in ~0.3-0.6 s
# against the local model's 4.7-5.5 s. The local model stays as the fallback
# underneath it, which is exactly what classic runs, so a missing key or a
# dead network costs SPEED and never repairs. No backend at all means no
# repair: the transcript stays exactly as pasted, and the only trace is one
# line in app.log.
#
# THE CLOUD LEG SENDS TRANSCRIPT TEXT OFF THIS MACHINE. Your audio never
# leaves it — ASR is local whatever this says — but the words do, to Groq,
# under their free-tier terms. prefer = "ollama" declines that entirely and
# costs you the seconds back.
#
# IT SITS IN FRONT OF YOUR CURSOR, and that costs you seconds. It was tried
# the other way — paste instantly, rewrite the text on screen a few seconds
# later — and moved back, because text that might still change is text you
# cannot send: you never know whether what you are looking at is the final
# version. So the rule is simple and worth relying on:
#
#     "..." on screen  = not finished
#     text on screen   = finished, and it will not change again
when = "always"           # never | known | always
                          # "known" only runs when the transcript contains
                          # something you have corrected before, which keeps
                          # most dictations fast and misses most repairs.
                          # "always" is the default because the pass is worth
                          # its wait when it fires: 17.9% -> 13.9% WER on the
                          # corrected clips, 3 better and 0 worse
min_chars = 20            # below this there is no context to reason from, which
                          # is exactly where a model starts inventing some

prefer = "groq"           # FAST VERSION ONLY — classic ignores this key and
                          # the four below it, and always repairs locally.
                          # They are written here anyway because both versions
                          # commit a byte-identical config.toml (see
                          # versions.py) and because a knob you cannot find is
                          # a knob you do not have.
                          #
                          # groq | cerebras | ollama — WHICH BACKEND REPAIRS
                          # FIRST. The others follow in order underneath it,
                          # ollama always among them, so this is a preference
                          # and never a commitment. ONE EXCEPTION: cerebras
                          # is never a fallback, only a first choice — see
                          # its entry below.
                          #   "groq"     Groq's free API (console.groq.com).
                          #              No credit card, ~1,000 requests a day
                          #              against the dozens a working day of
                          #              dictation spends, and a repair in
                          #              ~0.3-0.6 s instead of ~5 s. Needs
                          #              GROQ_API_KEY in .env; without one it
                          #              is skipped with one log line and this
                          #              setting costs you nothing.
                          #   "cerebras" WAS the default, on a documented ~1M
                          #              tokens/day free tier. That tier is
                          #              gone — verified live on a fresh
                          #              account 2026-08-22: HTTP 402 on every
                          #              model, cheapest plan $1,500+/month.
                          #              Kept working for whoever still holds
                          #              quota there — but OPT-IN ONLY. It is
                          #              out of the fallback chain, because a
                          #              backend certain to answer 402 cannot
                          #              repair anything and spends the one
                          #              thing you feel, the wait before the
                          #              text lands. Name it here and it runs
                          #              first, exactly as it always did.
                          #   "ollama"   local gemma3:12b, no cloud ever.
                          #              This IS the classic version's
                          #              behavior, in one line.
groq_model = "openai/gpt-oss-120b"
                          # The strongest model on Groq's free catalog,
                          # measured 2026-08-22. NOT llama-3.3-70b-versatile:
                          # it was the obvious pick and it is no longer
                          # offered — their catalog drifts, so list /v1/models
                          # before trusting a name here.
                          # IT IS A REASONING MODEL: it spends hidden tokens
                          # before answering, and with a tight token cap the
                          # reply arrives EMPTY. translate.py::GroqTranslator
                          # sets reasoning_effort=low and floors the cap at
                          # 256 to stop that; a model you swap in here inherits
                          # both. The letter-for-letter safety check covers
                          # whatever answers, so a weaker model wastes a
                          # request rather than your words
groq_timeout_s = 20       # a warm Groq answer lands in well under 2 s, so past
                          # this something is wrong and the fallback should
                          # have the work instead. Separate from the Cerebras
                          # and Ollama timeouts because it is a different
                          # provider with a different failure shape
cerebras_model = "gpt-oss-120b"
                          # only relevant while quota exists there. Kept so
                          # that going back later is a config edit and not a
                          # code change
cerebras_timeout_s = 20   # same reasoning as groq_timeout_s, same number

ollama_model = "gemma3:12b"
                          # Measured 2026-08-17 on the 11 recordings in recent\
                          # that you corrected by hand, so the intended words
                          # are known:
                          #     raw transcript       14.2% WER
                          #     gemma3:12b           10.9% / 10.7% on two runs
                          #                                  4-5 better, 0 worse
                          #     qwen2.5-coder:14b    13.8%   4 better, 2 worse
                          #     llama3.1:8b          16.0%   3 better, 3 WORSE
                          #     aya-expanse:8b       15.7%   0 better, 2 worse
                          #     dictalm2.0 (Hebrew)  14.2%   all 11 rejected
                          # The Hebrew-native model was the obvious bet and it
                          # lost — it will not hold the output format (one reply
                          # came back 158 words against a 2-word transcript).
                          # llama3.1:8b, which this used to default to, makes
                          # your transcript WORSE than leaving it alone.
                          # "" = reuse [translate] ollama_model.
                          # Smaller is NOT faster enough to be worth it,
                          # measured 2026-08-17 on the same clips:
                          #     gemma3:4b   18.9% WER (WORSE than raw), 3.0 s
                          #     qwen2.5:7b  17.6% WER (a wash),         3.0 s
                          # 2.5 s saved for the whole benefit lost.
                          # NOTE ON VRAM: gemma3:12b is ~8.5 GB and the two
                          # Whisper models are ~6 GB. On a 16 GB card that fits
                          # with little to spare
max_wait_s = 10           # THE LONGEST YOUR PASTE MAY BE HELD UP. Past this
                          # the unrepaired transcript is pasted and the reply
                          # is discarded whenever it turns up.
                          # 10 and not 6: gemma3:12b averages 4.7-5.5 s and
                          # peaks at 6.2 s, so 6 would time out on exactly the
                          # long dictations that need it most. It also caps a
                          # COLD Ollama, which took 53.7 s (2026-08-14)
warm_up = true            # send one throwaway request at startup so the model
                          # is in VRAM before a dictation needs it (76 s cold
                          # vs 2.5 s warm). Costs that VRAM all session

[gemini]
# Free-tier quota is PER MODEL (gemini-2.5-flash = 20 requests/day), so this
# list is a longer runway: each is tried in order and rested when it reports
# its cap. Verified as supporting audio input on 2026-08-12.
models = [
  "gemini-2.5-flash",
  "gemini-flash-latest",
  "gemini-2.5-flash-lite",
  "gemini-flash-lite-latest",
]
timeout_s = 30

[local]
model = "ivrit-ai/whisper-large-v3-turbo-ct2"
language = "he"               # MUST stay pinned — the fine-tune broke language autodetect
device = "auto"               # auto | cuda | cpu — auto tries the GPU, falls back to CPU
cleanup = true                # strip "אה"/"אמ" and collapse restarted phrases
                              # (Whisper only transcribes; Gemini also cleans)
extra_fillers = []            # add your own, e.g. ["כאילו"] — only add words you
                              # never mean literally; "כאילו" is a real word too

# Biases the decoder towards "Hebrew with English technical terms", which is
# how this actually gets used. Without it the model DROPS the English half of
# a mixed sentence. Measured: Hebrew WER 10.8% -> 9.6%. Add your own jargon.
initial_prompt = "שיחה בעברית עם מונחים טכניים באנגלית כמו commit, branch, pull request, merge, deploy, terminal, repo, bug, feature."

# The Hebrew fine-tune transliterates SHORT pure-English utterances
# ("Should it work?" -> "שיידי וורק"). Confident English is routed to a
# general model instead. Set english_model = "" to disable.
english_model = "deepdml/faster-whisper-large-v3-turbo-ct2"
english_threshold = 0.8       # high on purpose: mis-detected Hebrew is far worse
                              # than a transliterated English word

# --- not inventing words you never said -------------------------------------
# Whisper keeps decoding past the end of real speech and fills the gap with
# fluent text from its training data. This fine-tune was trained on Knesset
# protocols, so what it fills in is parliamentary: a dictation about adding
# cities to an app ended with "אדוני היושב-ראש, חברי הכנסת" (observed
# 2026-08-12).
#
# This comment used to end "Neither setting touches transcription quality —
# measured byte-identical output on good audio." That was measured 2026-08-12
# on a corpus with no long clips and it was WRONG. Tightening a threshold
# makes Whisper reject more windows, and a rejected window goes down the
# temperature fallback ladder, which SAMPLES: one 25.2 s clip gave 5 DIFFERENT
# transcripts in 5 runs at fixed settings (4 to 33 word errors), and when a
# sampled attempt won, whole spoken sentences vanished — 19 consecutive words
# in one observed case, with the audio intact. hallucination_guards() now pins
# temperature=[0.0], which makes the decode reproducible AND 58.7% faster
# (144.7 s -> 59.8 s over the 50 clips in recent\, measured 2026-08-28 on a
# CONTENDED GPU — re-time on a quiet machine before quoting it). The claim of
# byte-identical output is true again now, and was not true before.
guard_hallucinations = true      # tighten Whisper's own confidence thresholds
                                 # and enable hallucination_silence_threshold

beam_size = 5                    # FAST VERSION ONLY — classic ignores this key
                                 # and always decodes at 5.
                                 # Beam width for the decoder. 5 is what this
                                 # app has always run; lower (try 2) transcribes
                                 # faster on exactly the short clips dictation
                                 # produces, at some accuracy cost, and 1 is
                                 # greedy. DO NOT change it on a hunch: replay
                                 # the recordings in recent\ with
                                 # `main.py --benchmark` both ways and keep the
                                 # change only if the WER trade is one you want.
                                 # This is the whole reason the knob exists
drop_trailing_boilerplate = true # drop parliamentary phrases stuck to the END
                                 # of a transcript (never the middle — there
                                 # they are almost certainly really yours)
extra_boilerplate = []           # your own phrases, e.g. ["תודה שצפיתם"].
                                 # WHOLE PHRASES only: a single common word
                                 # here would delete real speech
