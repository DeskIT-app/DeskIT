# Hebrew push-to-talk dictation — settings.
# Hotkey names come from the table in hotkey.py ("right ctrl", "f9", "scroll lock", "a".."z"...).
hotkey = "right ctrl"         # hold = dictate Hebrew
# Off: one key handles Hebrew AND English in the same press, thanks to
# [local] initial_prompt below. Set this to a key name (e.g. "f9") only if you
# want a dedicated English key for utterances that are ENTIRELY English —
# those are the one case the Hebrew model transliterates. If you do, avoid
# "right alt" (releasing Alt alone pops the menu bar and steals focus right
# before the paste) and "right shift" (8 s hold triggers Windows FilterKeys).
english_hotkey = ""
# Holding a key is fine for a sentence and miserable for a paragraph. TAP this
# one WHILE still holding the hotkey and the recording LOCKS ON: let go of the
# hotkey and keep talking with no time limit, then tap it again to transcribe
# (or esc to discard). Pick a key the hand already on `hotkey` can reach without
# letting go — "left" (the left-arrow) sits right next to right ctrl. It is the
# one key the app swallows, and only while it is doing this job: idle, the arrow
# still moves the caret as usual. "" turns it off.
latch_hotkey = "left"
# TAP (don't hold) to turn what is already at the cursor into English:
# whatever is selected, or the whole field when nothing is selected.
# "" turns it off. See [translate] below.
translate_hotkey = "f9"
# Fix the words it got wrong RIGHT WHERE THEY LANDED — in Chrome, in Claude
# Code, wherever you pasted — then TAP this key. It reads the corrected text
# off the screen, diffs it against what it produced, and feeds those words to
# the decoder from then on so it stops getting them wrong.
# There is no edit box on purpose: Tk 8.6 has no bidi support whatsoever, so a
# box showing mixed Hebrew and English renders scrambled and the caret jumps
# around as you type. You are already fixing the text in an app that renders
# Hebrew properly — reading it beats asking for it again in a worse editor.
# Select just the corrected sentence if the field holds a lot of other text.
# "" turns it off. See [vocab] below.
correct_hotkey = "f8"
# local = unlimited, offline, ~0.3 s. Measured 2026-08-12 on 8 real Hebrew
# clips: local 10.8% WER / 0.38 s vs gemini 15.9% WER / 2.71 s. Switch to
# "gemini" if you ever want its stronger cleanup instead.
backend = "local"             # gemini | local | fake
paste_chord = "ctrl+v"        # try "shift+insert" for terminals that reject ctrl+v
restore_delay_ms = 300        # wait after pasting before restoring the old clipboard
min_seconds = 0.3             # shorter holds are treated as accidental taps and discarded
max_seconds = 400             # runaway-recording cap while HELD: stop, discard, error beep
latch_max_seconds = 0         # the cap once latched. 0 = none — max_seconds only
                              # guards against a key-up the OS swallowed, and a
                              # latched recording has no key-up to lose
fallback_to_local = true      # when every cloud model is out of quota, use local whisper
splash = true                 # show a small window while the models load (~25 s).
                              # Without it, clicking the shortcut looks like it did
                              # nothing, and the natural response is to click again
indicator = true              # small dot, top-right: blue = running, red = recording,
                              # red breathing = locked on, amber = transcribing.
                              # Click-through, so it never blocks the X button

[audio]
sample_rate = 16000
device = "1"                  # Arctis 7 headset mic (from --list-devices; "" = system default)

[feedback]
enabled = true                # paste a marker at the cursor while transcribing
placeholder = "..."           # replaced by your text when it arrives
retry_seconds = 45            # keep retrying this long before spooling to pending\

[translate]
# Whisper only transcribes, so translating needs a language model. Gemini
# goes first (it keeps English technical terms in Latin script and holds
# the register); when its daily cap is spent this drops to a local Ollama
# model, so the key never becomes another thing that dies at 20 requests.
target = "English"
max_chars = 5000              # a guard: above this the key refuses, on the
                              # assumption ctrl+a caught a whole document
ollama_model = "llama3.1:8b"  # the fallback; must be pulled in ollama
ollama_url = "http://localhost:11434"
timeout_s = 30                # gemini
ollama_timeout_s = 150        # ollama loads ~5 GB into VRAM on the first
                              # request after idling: 76 s cold, 2.5 s warm
                              # (measured 2026-08-12)
settle_ms = 120               # how long the focused app gets to answer a copy

[server]
# Dictate from the PHONE, transcribe on this GPU: the phone records and
# posts the audio here, so you keep the Hebrew fine-tune instead of falling
# back to whatever the phone's keyboard offers. Runs inside this app and
# borrows the model that is already loaded.
# Reachability is Tailscale's job — see the README. host = "" binds to the
# Tailscale address when it is up (and 127.0.0.1 when it is not), so this
# never answers the home LAN.
enabled = true
host = ""
port = 8756

[vocab]
# The names Whisper has never heard, fed to the decoder BEFORE it runs so it
# never produces the garble in the first place. This is the half of "learning"
# that actually matters — repairing afterwards is the safety net.
#
# Why this exists as a separate mechanism from [local] initial_prompt, measured
# 2026-08-14 by spying on WhisperModel.get_prompt over 125 s of real speech:
# with condition_on_previous_text=false (which the app sets), initial_prompt is
# DROPPED after the first 30-second window — it survived in 1 of 5 windows —
# while hotwords is re-injected per window and survived in 6 of 6. Long
# dictations are exactly where names garble worst, so the vocabulary has to
# travel by the mechanism that reaches them. Both are used; they coexist.
enabled = true
max_terms = 40            # kept well under faster-whisper's 223-token hotword
                          # ceiling: Hebrew costs several tokens a word, and
                          # over-prompting Whisper makes it emit the prompted
                          # words unbidden. A longer list is not a better one
replace_after_hits = 2    # how many times the SAME garble must be corrected
                          # before it is also repaired automatically. 1 would
                          # let one slip in the correction box start rewriting
                          # a word you really say
keep_audio = 50           # keep this many recent recordings in recent\, so a
                          # correction can be tied to the AUDIO that produced
                          # it. That is what makes `main.py --benchmark` able
                          # to prove a vocabulary change helped instead of
                          # leaving it to impressions.
                          # PRIVACY: raw audio of what you dictated, on this
                          # disk. Gitignored, capped, oldest dropped first.
                          # 0 keeps none — everything else still works, you
                          # just lose the ability to measure.

# Seeds: your own stack, written by hand. Anything you correct with the
# correction key is added to vocab.json automatically and ranks alongside
# these. Real mishearings from transcripts.log that these are here to stop:
# "Expo Go" -> "xpogo", "--branch" -> "Brinth", "Cowork" -> "בקו-ורק",
# "HebrewDictation" -> "Hebrew reduction", "Play Protect" -> "PlayProtect Scance".
terms = [
  # this machine's projects
  "HebrewDictation", "Massif", "TripSync", "Cowork",
  # the toolchain that keeps coming out wrong
  "Expo", "Expo Go", "EAS", "npx", "APK", "Gradle", "Android Studio",
  "Play Protect", "GitHub", "Tailscale", "Ollama", "Claude Code", "Whisper",
  # git/dev terms — also in [local] initial_prompt, repeated here because
  # that one stops reaching the decoder after 30 seconds
  "commit", "branch", "pull request", "merge", "deploy", "production",
  "repo", "terminal", "bug", "feature", "prompt", "config",
]

[polish]
# The context pass: the half that vocab CANNOT do. Some mishearings swap a real
# Hebrew word for another real Hebrew word — מקלדת -> מקללת, סריקה -> סירקה,
# קירור -> קירוב — and no lookup table can fix those safely, because the heard
# form is a word you might genuinely have said. Only the sentence around it
# disambiguates. So a language model reads the sentence and fixes the word.
#
# It is allowed to read context. It is NOT allowed to write. The instruction not
# to invent is in the prompt AND enforced in code (polish.py::_is_safe): every
# reply is diffed against the transcript and THROWN AWAY if the model did more
# than swap words — >15% change in word count, or <75% of the words surviving.
# A rejected reply is not retried; the raw transcript goes through untouched.
#
# Ollama first here, the reverse of [translate], because this runs on dictations
# (dozens a day) rather than on a key you tap — Gemini's 20/day/model would be
# gone before lunch and would take translation down with it.
when = "never"            # never | known | always
                          # "known": only when the transcript contains something
                          # you have corrected before. Costs nothing on the
                          # dictations that don't need it, and only wakes an idle
                          # Ollama (76 s cold, 2.5 s warm) when there is real
                          # evidence a repair is due. "always" is more accurate
                          # and much slower — try it before deciding it isn't
                          # worth it
min_chars = 20            # below this there is no context to reason from, which
                          # is exactly where a model starts inventing some
ollama_model = ""         # "" = reuse [translate] ollama_model
max_wait_s = 6            # THE LONGEST YOUR PASTE MAY BE HELD UP. This pass
                          # sits between your speech and your cursor, so past
                          # this the raw transcript is pasted and the reply is
                          # discarded whenever it turns up.
                          # Measured 2026-08-14 and the reason this exists: a
                          # COLD Ollama took 53.7 s. The text sat unpasted the
                          # whole time, looked like a failure, got re-dictated,
                          # and then both landed 1.5 s apart.
warm_up = true            # send one throwaway request at startup so the ~5 GB
                          # is in VRAM before a dictation needs it (76 s cold
                          # vs 2.5 s warm). Costs that VRAM all session

[gemini]
# Free-tier quota is PER MODEL (gemini-2.5-flash = 20 requests/day), so this
# list is a longer runway: each is tried in order and rested when it reports
# its cap. Verified as supporting audio input on 2026-08-12.
models = [
  "gemini-2.5-flash",
  "gemini-flash-latest",
  "gemini-2.5-flash-lite",
  "gemini-flash-lite-latest",
]
timeout_s = 30

[local]
model = "ivrit-ai/whisper-large-v3-turbo-ct2"
language = "he"               # MUST stay pinned — the fine-tune broke language autodetect
device = "auto"               # auto | cuda | cpu — auto tries the GPU, falls back to CPU
cleanup = true                # strip "אה"/"אמ" and collapse restarted phrases
                              # (Whisper only transcribes; Gemini also cleans)
extra_fillers = []            # add your own, e.g. ["כאילו"] — only add words you
                              # never mean literally; "כאילו" is a real word too

# Biases the decoder towards "Hebrew with English technical terms", which is
# how this actually gets used. Without it the model DROPS the English half of
# a mixed sentence. Measured: Hebrew WER 10.8% -> 9.6%. Add your own jargon.
initial_prompt = "שיחה בעברית עם מונחים טכניים באנגלית כמו commit, branch, pull request, merge, deploy, terminal, repo, bug, feature."

# The Hebrew fine-tune transliterates SHORT pure-English utterances
# ("Should it work?" -> "שיידי וורק"). Confident English is routed to a
# general model instead. Set english_model = "" to disable.
english_model = "deepdml/faster-whisper-large-v3-turbo-ct2"
english_threshold = 0.8       # high on purpose: mis-detected Hebrew is far worse
                              # than a transliterated English word

# --- not inventing words you never said -------------------------------------
# Whisper keeps decoding past the end of real speech and fills the gap with
# fluent text from its training data. This fine-tune was trained on Knesset
# protocols, so what it fills in is parliamentary: a dictation about adding
# cities to an app ended with "אדוני היושב-ראש, חברי הכנסת" (observed
# 2026-08-12). Neither setting touches transcription quality — measured
# byte-identical output on good audio.
guard_hallucinations = true      # tighten Whisper's own confidence thresholds
                                 # and enable hallucination_silence_threshold
drop_trailing_boilerplate = true # drop parliamentary phrases stuck to the END
                                 # of a transcript (never the middle — there
                                 # they are almost certainly really yours)
extra_boilerplate = []           # your own phrases, e.g. ["תודה שצפיתם"].
                                 # WHOLE PHRASES only: a single common word
                                 # here would delete real speech
